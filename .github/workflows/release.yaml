name: CI & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - LICENSE
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - LICENSE

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run build
      - run: pnpm test

  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for npm Trusted Publishing (OIDC)

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      # No registry-url here - it makes actions/setup-node write an auth
      # line that breaks the OIDC flow. npm defaults to registry.npmjs.org.
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pnpm install --frozen-lockfile

      # OIDC trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: pnpm run build
      - run: npm publish --access public
